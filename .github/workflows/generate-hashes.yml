
name: Forensic Project Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Repository Structure
        run: |
          for file in README.md report/final_report.md artifacts/card_data.txt artifacts/communication.log artifacts/gps_data.txt artifacts/transactions.csv artifacts/email_evidence.txt scripts/generate_hashes.py scripts/analyze_evidence.py scripts/password_cracking.py chain_of_custody/chain_of_custody.csv; do
            test -f "$file" || { echo "Missing: $file"; exit 1; }
          done
          echo "Repository structure validated!"

      - name: Analyze Evidence
        run: python scripts/analyze_evidence.py

      - name: Password Dictionary Simulation
        run: python scripts/password_cracking.py

      - name: Generate SHA256 Hashes
        run: python scripts/generate_hashes.py

      - name: Save Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hashes/SHA256SUMS.txt report/analysis_results.txt report/password_cracking_results.txt
          git diff --cached --quiet || git commit -m "Update forensic results"
          git push

