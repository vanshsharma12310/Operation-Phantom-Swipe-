
name: Generate Forensic Hashes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-hashes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate SHA-256 Hashes
        run: python scripts/generate_hashes.py

      - name: Save Hashes to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hashes/SHA256SUMS.txt
          git diff --cached --quiet || git commit -m "Add SHA-256 evidence hashes"
          git push
