
name: Generate Forensic Hashes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-hashes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Analyze Evidence Files
        run: python scripts/analyze_evidence.py

      - name: Simulate Dictionary Attack
        run: python scripts/password_cracking.py

      - name: Generate SHA-256 Hashes
        run: python scripts/generate_hashes.py

      - name: Save Results to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hashes/SHA256SUMS.txt report/analysis_results.txt report/password_cracking_results.txt
          git diff --cached --quiet || git commit -m "Update forensic analysis and hashes"
          git push

